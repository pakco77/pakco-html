<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HTML PPT Picker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#0b0c10;color:#e8ebf4;font-family:'Inter','PingFang SC',system-ui,sans-serif}

  /* ───── Header ───── */
  header{position:sticky;top:0;z-index:50;background:rgba(11,12,16,.92);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.08);padding:16px 32px 12px;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;row-gap:14px}
  header .brand h1{margin:0;font-size:20px;letter-spacing:-.01em;font-weight:800}
  header .brand h1 .accent{background:linear-gradient(135deg,#a78bfa 0%,#f472b6 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  header .brand .sub{color:#8a90a4;font-size:12px;margin-top:2px}

  /* Middle install command */
  .install{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 6px 6px 14px;
    font-family:'JetBrains Mono','SFMono-Regular',monospace;font-size:13px;color:#cfd4e2;
    max-width:520px}
  .install .prompt{color:#6a7086;user-select:none}
  .install code{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8ebf4}
  .install button{background:linear-gradient(135deg,#a78bfa 0%,#f472b6 100%);color:#fff;border:0;
    padding:6px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;
    font-family:'Inter',sans-serif;transition:.15s;white-space:nowrap}
  .install button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(167,139,250,.4)}
  .install button.ok{background:#1aaf6c}

  /* Top-right controls */
  .controls{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .controls input[type=search]{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    color:#e8ebf4;padding:8px 14px;border-radius:8px;font-size:13px;width:200px;outline:none}
  .controls input[type=search]:focus{border-color:#a78bfa}
  .controls .size-toggle,.controls .lang-toggle{display:flex;background:rgba(255,255,255,.05);border-radius:8px;padding:3px}
  .controls .size-toggle button,.controls .lang-toggle button{padding:6px 12px;font-size:12px;color:#aab0c0;background:transparent;
    border:0;border-radius:6px;cursor:pointer;font-family:'Inter','PingFang SC',sans-serif;font-weight:600}
  .controls .size-toggle button.active,.controls .lang-toggle button.active{background:rgba(255,255,255,.12);color:#fff}
  .controls .lang-toggle button.active{background:linear-gradient(135deg,#a78bfa 0%,#f472b6 100%);color:#fff}

  /* Tabs */
  .tabs{grid-column:1/-1;display:flex;gap:4px;background:rgba(255,255,255,.05);padding:4px;
    border-radius:10px;width:fit-content;margin:0 auto;margin-top:4px}
  .tab{padding:9px 22px;font-size:13px;font-weight:600;color:#aab0c0;border:0;background:transparent;
    border-radius:7px;cursor:pointer;transition:.15s;font-family:'Inter','PingFang SC',sans-serif}
  .tab.active{background:#fff;color:#0b0c10}
  .tab:not(.active):hover{color:#fff;background:rgba(255,255,255,.08)}

  /* Grid + Card */
  main{padding:24px 32px 64px}
  .grid{display:grid;gap:16px}
  .grid.size-s{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .grid.size-m{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .grid.size-l{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
  .card{background:#13141a;border:1px solid rgba(255,255,255,.08);border-radius:12px;
    overflow:hidden;transition:.2s;cursor:pointer;position:relative}
  .card:hover{transform:translateY(-2px);border-color:rgba(167,139,250,.4);
    box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .card.copied{border-color:#1aaf6c;box-shadow:0 0 0 2px rgba(26,175,108,.3)}
  .preview{aspect-ratio:16/10;background:#fff;position:relative;overflow:hidden}
  .preview iframe{position:absolute;inset:0;width:166.67%;height:166.67%;border:0;
    transform:scale(.6);transform-origin:0 0;pointer-events:none}
  .preview .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;
    font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;z-index:2}
  .preview .badge.scenario{background:rgba(167,139,250,.85)}
  .preview .badge.extracted{background:rgba(244,114,182,.85)}

  /* Copy button on each card (no propagation) */
  .copy-btn{position:absolute;top:8px;right:8px;z-index:3;background:rgba(167,139,250,.85);
    color:#fff;border:0;padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;
    cursor:pointer;font-family:'Inter','PingFang SC',sans-serif;opacity:0;transition:.15s}
  .card:hover .copy-btn{opacity:1}
  .copy-btn:hover{background:#a78bfa;transform:scale(1.05)}
  .copy-btn.ok{background:#1aaf6c;opacity:1}

  /* Zoom hint bottom-right */
  .zoom-hint{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;
    font-size:10px;padding:3px 8px;border-radius:4px;opacity:0;transition:.15s;pointer-events:none;
    font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
  .card:hover .zoom-hint{opacity:1}

  .meta{padding:12px 14px}
  .meta .name{margin:0;font-size:13px;font-weight:700;letter-spacing:-.01em}
  .meta .desc{margin:4px 0 0;font-size:11px;color:#8a90a4;line-height:1.5}
  .meta .id{margin:6px 0 0;font-size:10px;color:#5a6076;font-family:'JetBrains Mono',monospace}
  .meta .author{margin:4px 0 0;font-size:10px;color:#6a7086;font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
  .meta .feat{margin:4px 0 0;font-size:10px;display:flex;gap:6px;flex-wrap:wrap}
  .meta .feat span{padding:1px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace;letter-spacing:.03em}
  .meta .feat .yes{background:rgba(26,175,108,.15);color:#1aaf6c}
  .meta .feat .no{background:rgba(255,255,255,.05);color:#5a6076}
  .empty{padding:80px 20px;text-align:center;color:#5a6076}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);
    z-index:100;display:none;align-items:center;justify-content:center;padding:32px}
  .modal.open{display:flex}
  .modal-wrap{position:relative;width:min(1280px,95vw);aspect-ratio:16/10;max-height:90vh;
    background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.6)}
  .modal-inner{position:absolute;inset:0}
  .modal-inner iframe{width:100%;height:100%;border:0;display:block}
  .modal-close{position:absolute;top:14px;right:14px;z-index:5;background:rgba(0,0,0,.7);color:#fff;
    border:0;width:36px;height:36px;border-radius:18px;cursor:pointer;font-size:18px;line-height:1}
  .modal-close:hover{background:rgba(0,0,0,.95)}
  .modal-copy{position:absolute;top:14px;right:60px;z-index:5;background:rgba(167,139,250,.95);color:#fff;
    border:0;height:36px;padding:0 14px;border-radius:18px;cursor:pointer;font-size:13px;font-weight:600;
    font-family:'Inter','PingFang SC',sans-serif;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .modal-copy:hover{background:#a78bfa;transform:translateY(-1px)}
  .modal-copy.ok{background:#1aaf6c}
  .modal-name{position:absolute;top:14px;left:14px;z-index:5;background:rgba(0,0,0,.7);color:#fff;
    padding:8px 16px;border-radius:18px;font-size:13px;font-weight:600;
    font-family:'Inter','PingFang SC',sans-serif}

  /* Toast */
  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(26,175,108,.95);color:#fff;padding:12px 24px;border-radius:24px;
    font-size:13px;font-weight:600;font-family:'Inter','PingFang SC',sans-serif;
    box-shadow:0 12px 30px rgba(26,175,108,.4);opacity:0;pointer-events:none;transition:.3s;z-index:200;
    display:flex;align-items:center;gap:8px;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .icon{font-size:16px}

  /* Guide */
  .guide{max-width:980px;margin:0 auto;padding:24px 0;color:#cfd4e2;line-height:1.7;font-size:14px}
  .guide h2{font-size:22px;font-weight:800;margin:32px 0 14px;letter-spacing:-.01em;display:flex;align-items:center;gap:12px}
  .guide h2 .num{display:inline-flex;width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,#a78bfa 0%,#f472b6 100%);color:#fff;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .guide p{margin:0 0 12px;color:#aab0c0}
  .guide ul{margin:0 0 16px;padding-left:24px;color:#aab0c0}
  .guide ul li{margin:4px 0}
  .guide code{background:rgba(255,255,255,.08);padding:2px 7px;border-radius:4px;
    font-family:'JetBrains Mono',monospace;font-size:12px;color:#f472b6}
  .guide .block{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:10px;padding:18px 22px;margin:14px 0}
  .guide .cmd-block{background:#0a0b0f;border:1px solid rgba(255,255,255,.08);border-radius:10px;
    padding:14px 18px;margin:14px 0;font-family:'JetBrains Mono',monospace;display:flex;
    align-items:center;gap:10px}
  .guide .cmd-block .prompt{color:#6a7086}
  .guide .cmd-block code{background:transparent;padding:0;color:#e8ebf4;font-size:13px;flex:1}
  .guide .cmd-block button{background:linear-gradient(135deg,#a78bfa 0%,#f472b6 100%);color:#fff;border:0;
    padding:6px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;
    font-family:'Inter','PingFang SC',sans-serif}
  .guide .cmd-block button.ok{background:#1aaf6c}
  .guide table{width:100%;border-collapse:collapse;margin:14px 0;background:rgba(255,255,255,.03);border-radius:8px;overflow:hidden}
  .guide table td{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;vertical-align:top}
  .guide table td:first-child{font-family:'JetBrains Mono',monospace;color:#f472b6;width:38%;white-space:nowrap}
  .guide table tr:last-child td{border-bottom:0}
  .guide .example{background:rgba(167,139,250,.08);border-left:3px solid #a78bfa;padding:8px 14px;margin:6px 0;
    font-size:13px;color:#cfd4e2;border-radius:0 6px 6px 0}
  .guide .links{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
  .guide .links a{color:#a78bfa;text-decoration:none;background:rgba(167,139,250,.1);
    border:1px solid rgba(167,139,250,.3);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;transition:.15s}
  .guide .links a:hover{background:rgba(167,139,250,.2);border-color:#a78bfa;transform:translateY(-1px)}

  @media (max-width:920px){
    header{grid-template-columns:1fr;text-align:center}
    .install{max-width:none}
    .controls{justify-content:center}
    .tabs{margin-top:0}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>HTML PPT Picker <span class="accent">· Visual deck selector</span></h1>
    <div class="sub" id="brand-sub"></div>
  </div>

  <div class="install" id="install-bar">
    <span class="prompt">$</span>
    <code id="install-cmd">npx skills add https://github.com/pakco77/html-ppt-picker</code>
    <button id="install-copy"></button>
  </div>

  <div class="controls">
    <input type="search" id="search">
    <div class="lang-toggle" role="group" aria-label="Language">
      <button data-lang="zh" class="active">中</button>
      <button data-lang="en">EN</button>
    </div>
    <div class="size-toggle">
      <button data-size="s"></button>
      <button data-size="m" class="active"></button>
      <button data-size="l"></button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-view="themes"></button>
    <button class="tab" data-view="decks"></button>
    <button class="tab" data-view="guide"></button>
  </div>
</header>

<main>
  <div id="grid" class="grid size-m"></div>
  <div id="empty" class="empty" style="display:none"></div>
  <div id="guide" class="guide" style="display:none"></div>
</main>

<div class="toast" id="toast">
  <span class="icon">✓</span>
  <span id="toast-text"></span>
</div>

<div class="modal" id="modal">
  <div class="modal-wrap">
    <span class="modal-name" id="modal-name"></span>
    <button class="modal-copy" id="modal-copy"></button>
    <button class="modal-close" id="modal-close">×</button>
    <div class="modal-inner">
      <iframe id="modal-iframe" src="" allow="fullscreen" allowfullscreen></iframe>
    </div>
  </div>
</div>

/* ───── Copy + toast ───── */
async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); document.body.removeChild(ta); return true; }
    catch(_){ document.body.removeChild(ta); return false; }
  }
}

const toast = document.getElementById('toast');
const toastText = document.getElementById('toast-text');
let toastTimer = null;
function showToast(msg){
  toastText.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 2400);
}

/* ───── Static UI strings binding ───── */
function applyStaticI18n(){
  const t = T();
  document.documentElement.lang = t.htmlLang;

  // brand sub
  document.getElementById('brand-sub').innerHTML =
    `${t.sub}Fork from <a href="${UPSTREAM_URL}" target="_blank" style="color:#8a90a4;text-decoration:underline">@lewislulu</a> & <a href="https://github.com/op7418/guizang-ppt-skill" target="_blank" style="color:#8a90a4;text-decoration:underline">@guizang</a>`;

  // install bar
  document.getElementById('install-bar').title = t.installTitle;
  const installBtn = document.getElementById('install-copy');
  if(!installBtn.classList.contains('ok')) installBtn.textContent = t.copy;

  // search
  document.getElementById('search').placeholder = t.search;

  // size toggle labels
  document.querySelectorAll('.size-toggle button').forEach(b=>{
    b.textContent = b.dataset.size==='s' ? t.sizeS : b.dataset.size==='m' ? t.sizeM : t.sizeL;
  });

  // tabs
  document.querySelectorAll('.tab').forEach(b=>{
    b.textContent = b.dataset.view==='themes' ? t.tabThemes
                  : b.dataset.view==='decks'  ? t.tabDecks
                  : t.tabGuide;
  });

  // empty + toast default
  document.getElementById('empty').textContent = t.empty;
  document.getElementById('toast-text').textContent = t.toastDefault;
  document.getElementById('modal-copy').textContent = t.copyPrompt;

  // lang toggle active state
  document.querySelectorAll('.lang-toggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

/* ───── Render grid ───── */
const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const guideEl = document.getElementById('guide');

function render(){
  const t = T();

  if(view==='guide'){
    grid.style.display='none';
    emptyEl.style.display='none';
    guideEl.style.display='block';
    renderGuide();
    return;
  }
  grid.style.display='grid';
  guideEl.style.display='none';

  grid.innerHTML = '';
  const items = view==='themes' ? THEMES : DECKS;
  const filtered = items.filter(it=>{
    if(!q) return true;
    return it.join(' ').toLowerCase().includes(q.toLowerCase());
  });
  if(filtered.length===0){ emptyEl.style.display='block'; return }
  emptyEl.style.display='none';

  filtered.forEach(it=>{
    const card = document.createElement('div');
    card.className = 'card';
    let promptText, modalSrc, modalLabel;

    if(view==='themes'){
      const [name] = it;
      const label = themeLabel(it);
      const desc  = themeDesc(it);
      promptText = t.promptTheme(name, label);
      modalSrc   = {srcdoc: themeDemo(name, label)};
      modalLabel = `${label} · ${name}`;
      card.innerHTML = `
        <button class="copy-btn" type="button">${t.copyPrompt}</button>
        <span class="zoom-hint">${t.zoomHint}</span>
        <div class="preview">
          <iframe srcdoc='${themeDemo(name,label).replace(/'/g,"&apos;")}' loading="lazy"></iframe>
        </div>
        <div class="meta">
          <p class="name">${label}</p>
          <p class="desc">${desc}</p>
          <p class="id">assets/themes/${name}.css</p>
        </div>`;
    }else{
      const [name,,,kind] = it;
      const label = deckLabel(it);
      const desc  = deckDesc(it);
      const author  = it[6] || '';       // 第7字段: 作者
      const deckDir = it[7] || name;     // 第8字段: 实际目录名(缺省=id)
      const themeKey= it[8] || '';       // 第9字段: URL ?theme= 参数值

      // Guizang decks 用专用 prompt; 普通 deck 用 promptDeck
      if(author && themeKey && t.promptGuizang){
        promptText = t.promptGuizang(name, label, deckDir, themeKey);
      }else{
        promptText = t.promptDeck(name, label);
      }

      // iframe src: 带 theme 参数的指向实际目录
      const iframeParams = new URLSearchParams();
      iframeParams.set('lang', lang);
      if(themeKey) iframeParams.set('theme', themeKey);
      const iframeSrc = `full-decks/${deckDir}/index.html?${iframeParams}`;

      modalSrc   = {src: iframeSrc};
      modalLabel = `${label} · ${name}`;
      card.innerHTML = `
        <button class="copy-btn" type="button">${t.copyPrompt}</button>
        <span class="zoom-hint">${t.zoomHint}</span>
        <div class="preview">
          <span class="badge ${kind}">${kind}</span>
          <iframe src="${iframeSrc}" loading="lazy"></iframe>
        </div>
        <div class="meta">
          <p class="name">${label}</p>
          <p class="desc">${desc}</p>
          ${author ? `<p class="author">by ${author}</p>` : `<p class="author">by Lewis</p>`}
          <div class="feat">${author==='歸藏' ? `<span class="no">${t.featNoPresenter}</span>` : `<span class="yes">${t.featPresenter}</span>`}</div>
          <p class="id">templates/full-decks/${deckDir}/</p>
        </div>`;
    }

    card.addEventListener('click',()=>openModal(modalSrc, modalLabel, promptText));

    const copyBtn = card.querySelector('.copy-btn');
    copyBtn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ok = await copyToClipboard(promptText);
      if(ok){
        card.classList.add('copied');
        copyBtn.textContent = T().copied;
        showToast(T().toastCardCopied(card.querySelector('.name').textContent));
        setTimeout(()=>{
          card.classList.remove('copied');
          copyBtn.textContent = T().copyPrompt;
        }, 2400);
      }else{
        showToast(T().toastFail);
      }
    });

    grid.appendChild(card);
  });
}

/* ───── Guide ───── */
function renderGuide(){
  const t = T().guide;
  const shortcutRows = t.shortcuts.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  const stepsList    = t.steps.map(s=>`<li>${s}</li>`).join('');
  const exampleBoxes = t.examples.map(e=>`<div class="example">${e}</div>`).join('');
  const docLinks     = t.docLinks.map(([href,label])=>`<a href="${REPO_URL}${href}" target="_blank">${label}</a>`).join('');

  guideEl.innerHTML = `
    <h2><span class="num">1</span>${t.h1}</h2>
    <p>${t.h1desc}</p>
    <div class="cmd-block">
      <span class="prompt">$</span>
      <code>${INSTALL_CMD}</code>
      <button data-copy="${INSTALL_CMD}">${T().copy}</button>
    </div>
    <p style="margin-top:10px;color:#8a90a4;font-size:13px">${t.terminalTip}</p>
    <div class="links">
      <a href="${REPO_URL}" target="_blank">${t.linkRepo}</a>
      <a href="${REPO_URL}/archive/refs/heads/main.zip">${t.linkZip}</a>
      <a href="${REPO_URL}/releases" target="_blank">${t.linkRelease}</a>
      <a href="${UPSTREAM_URL}" target="_blank">${t.linkUpstream}</a>
      <a href="https://github.com/op7418/guizang-ppt-skill" target="_blank">${t.linkGuizang}</a>
    </div>

    <h2><span class="num">2</span>${t.h2}</h2>
    <div class="block"><p style="margin-top:0">${t.h2body}</p></div>
    <p style="margin-top:14px;color:#8a90a4">${t.h2steps}</p>
    <ul>${stepsList}</ul>

    <h2><span class="num">3</span>${t.h3}</h2>
    ${exampleBoxes}

    <h2><span class="num">4</span>${t.h4}</h2>
    <table>${shortcutRows}</table>

    <h2><span class="num">5</span>${t.h5}</h2>
    <div class="links">${docLinks}</div>

    <h2><span class="num">6</span>${t.h6}</h2>
    <div class="block"><p style="margin-top:0">${t.h6body}</p></div>

    <p style="margin-top:24px;color:#6a7086;font-size:12px;text-align:center">${t.tip}</p>
  `;
  guideEl.querySelectorAll('button[data-copy]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const ok = await copyToClipboard(btn.dataset.copy);
      if(ok){
        const orig = btn.textContent;
        btn.textContent = T().copied;
        btn.classList.add('ok');
        showToast(T().toastInstallShort);
        setTimeout(()=>{ btn.textContent = orig; btn.classList.remove('ok'); }, 2000);
      }
    });
  });
}

/* ───── Top install-bar copy ───── */
const installBar = document.getElementById('install-bar');
const installBtn = document.getElementById('install-copy');
async function copyInstall(){
  const ok = await copyToClipboard(INSTALL_CMD);
  if(ok){
    installBtn.textContent = T().copied;
    installBtn.classList.add('ok');
    showToast(T().toastInstall);
    setTimeout(()=>{ installBtn.textContent = T().copy; installBtn.classList.remove('ok'); }, 2000);
  }
}
installBtn.addEventListener('click', e=>{ e.stopPropagation(); copyInstall(); });
installBar.addEventListener('click', copyInstall);

/* ───── Tab / search / size / lang ───── */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    view = btn.dataset.view;
    const ctrls = document.querySelector('.controls');
    ctrls.style.visibility = view==='guide' ? 'hidden' : 'visible';
    render();
  });
});

document.querySelectorAll('.size-toggle button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.size-toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    grid.className = 'grid size-'+btn.dataset.size;
  });
});

document.querySelectorAll('.lang-toggle button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(btn.classList.contains('active')) return;
    lang = btn.dataset.lang;
    localStorage.setItem('htmlppt.lang', lang);
    applyStaticI18n();
    render();
  });
});

document.getElementById('search').addEventListener('input',e=>{
  q = e.target.value;
  render();
});

/* ───── Modal ───── */
const modal = document.getElementById('modal');
const modalIframe = document.getElementById('modal-iframe');
const modalName = document.getElementById('modal-name');
const modalCopy = document.getElementById('modal-copy');
let modalPrompt = '';
function openModal(src, name, prompt){
  modalIframe.removeAttribute('srcdoc');
  modalIframe.removeAttribute('src');
  if(src && typeof src === 'object' && 'srcdoc' in src){
    modalIframe.srcdoc = src.srcdoc;
  }else if(src && typeof src === 'object' && 'src' in src){
    modalIframe.src = src.src;
  }else if(typeof src === 'string'){
    modalIframe.src = src;
  }
  modalName.textContent = name;
  modalPrompt = prompt || '';
  modalCopy.style.display = prompt ? 'inline-flex' : 'none';
  modalCopy.textContent = T().copyPrompt;
  modalCopy.classList.remove('ok');
  modal.classList.add('open');
}
function closeModal(){
  modal.classList.remove('open');
  modalIframe.removeAttribute('srcdoc');
  modalIframe.removeAttribute('src');
}
document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
modalCopy.addEventListener('click', async e => {
  e.stopPropagation();
  if(!modalPrompt) return;
  const ok = await copyToClipboard(modalPrompt);
  if(ok){
    modalCopy.textContent = T().copied;
    modalCopy.classList.add('ok');
    showToast(T().toastPromptPasted);
    setTimeout(()=>{
      modalCopy.textContent = T().copyPrompt;
      modalCopy.classList.remove('ok');
    }, 2000);
  }
});

/* ───── Boot ───── */
applyStaticI18n();
render();
</script>
</body>
